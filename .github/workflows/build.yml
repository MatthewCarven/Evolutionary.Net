name: build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Evolutionary Studio
        run: dotnet build Studio/EvolutionaryStudio.csproj -c Release

      - name: Run headless smoke test
        run: dotnet Studio/bin/Release/net10.0-windows/EvolutionaryStudio.dll --smoke
